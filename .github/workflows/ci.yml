name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request event otherwise checks out GitHub's shallow synthetic
          # merge commit. Validate the actual PR branch history instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:public-boundary
      - run: npm test
      - run: docker build --tag vikunja-mcp-cloudflare-access:test .
